sacn:
  priority: 100
  sourceName: MarsinEngine
  destinations:
    - 127.0.0.1
  multicast: false
engine:
  fps: 40
  priority: high
mixer:
  maxChannels: 8
# /ws/viz preview broadcast. ADVISORY ONLY — never touches sACN. The full
# contract (defaults, validation, why the cap is per key) is the header of
# marsin_engine/lib/vis_budget.js; an unknown field or an unreadable value here
# makes the engine REFUSE TO BOOT rather than quietly ignore it.
vis:
  # Frames per second of preview. Default when absent: 1.
  broadcastHz: 5
  # DEFAULT sample budget — what every PER-CHANNEL key carries. Each channel's
  # strip is one RN <View> per sample on the iPad's UI thread, times however
  # many channels are open, so this stays small. Default when absent: 100.
  maxPixels: 100
  # Per-key overrides, allowed ONLY for the whole-rig composite keys
  # (master, preDimmer, rig, __deck_inactive__, __deck_swap__). Value is a
  # positive integer or `full` (= send every model pixel, no subsampling).
  #
  # rig + preDimmer run FULL RATE because their consumer is the Deck PIXELS
  # window (_225/_239) — a 2D canvas whose cost is per pixel DRAWN, not per
  # sample received, and whose whole job is showing the operator the real rig.
  # Costs ~13.5 KB/frame more than the capped pair on the 964-px titanic; drop
  # either to an integer (e.g. 240) if the iPad's WiFi ever needs the room.
  keyMaxPixels:
    rig: full
    preDimmer: full
server:
  port: 6968
vsn1:
  deployLayout: true
  deployDebounceMs: 1200
  deployOnBoot: true
playlist:
  active: false
  delay_s: '90'
  shuffle: true
web_client:
  enabled: false
  port: 6967
  build_dir: ../CaptainPad/dist
osc:
  enabled: true
  port: 10000
  host: 0.0.0.0
  gainMax: 2
  allowedSenders: []
  bindings: {}
fire_sync:
  enabled: true
  port: 7703
  host: 0.0.0.0
  effect: vintageWhite
  triggerMask: 0x07
  # Trigger envelope, LIGHTS ONLY (see lib/fire_sync_listener.js). These are the
  # BOOT DEFAULTS: the BM26-Stoker control panel owns the operator-set values,
  # persists them in its own NVS and pushes them here (fire_cfg) on save and
  # every 10 s — so an engine restart is back on the panel's numbers within 10 s
  # and this file is never written back.
  #   minOnMs   hold the lights on at least this long past the last flame edge
  #             (attack: vintage filaments need a moment to come up)
  #   releaseMs ramp the white down over this long when the flame stops
  #             (0 = instant off, the historical behavior). Bounds 0..5000.
  minOnMs: 150
  releaseMs: 400
  apiHost: 127.0.0.1
audio:
  enabled: false
  capture:
    backend: ffmpeg
    ffmpegPath: ffmpeg
    platform: auto
    device: null
    deviceLabel: null
    deviceId: null
    sampleRate: 44100
    channels: 1
    inputFormat: null
    loop: true
    captureBufferMs: 50
    jitterBufferHops: 4
    stopTimeoutMs: 2000
    stderrWarnIntervalMs: 60000
  fftSize: 2048
  hopSize: 512
  bands:
    lowMaxHz: 200
    midMaxHz: 4000
    attackMs: 6
    releaseMs: 180
    noiseGate: 0.04
    inputGain: 1
    sourceSmoothHz: 12000
  kick:
    minHz: 50
    maxHz: 110
    threshold: 2.4
    refractoryMs: 220
    decayMs: 70
  sub:
    minHz: 30
    maxHz: 60
  bpmTracker:
    # 70, not 60. A/B'd with tools/bpm_tune_eval.mjs across all four mic tiers
    # (identical settings otherwise): widening the band to 60 bought exactly one
    # thing — the 60 BPM synth row, which only exists because the band reaches
    # it — and COST two fast tempos to wrong locks the wider lag range opened up:
    # moderate 174 → 112 (-35.6%) and heavy 124 → 96 (-22.3%), both correct at
    # 70. Burning Man runs fast; a badly aliased 174 on a dusty night is the expensive
    # failure. Re-run the A/B before widening this again.
    # Measured on the TRACKED config in this file — no states/<scene>/audio_state.yaml
    # overlay. Re-verified by report _214, which reproduced both figures exactly; on
    # the operator's live overlay (inputGain 9.1) the moderate 174 failure VANISHES
    # (reads 173.3, -0.4%), so a re-run under `--effective` would silently delete the
    # evidence for minBpm 70. tests/audio/bpm_tune_eval.test.mjs locks these two
    # numbers to a third witness.
    minBpm: 70
    maxBpm: 180
    activityThreshold: 0.05
    silenceResetMs: 1200
    silenceResetEnabled: false
    # Published BPM walks to a new tempo instead of stepping to it, so a
    # re-lock/track change can't glitch the lights. Live-tunable from the
    # Audio Companion (OSC page) and PATCH /audio/config.
    outputSlewEnabled: true
    outputSlewBpmPerSec: 16
  structureDetector:
    enabled: true
    buildThreshold: 0.35
    dropEnergyJump: 4
    dropEdgeMode: windowed
    dropDeltaWindowMs: 400
    dropMinLevel: 0.06
    dropLevelAssist: false
    dropBuildGate: 0.5
    dropBuildMemoryMs: 3000
    dropSlowZoneMax: 0.3
    dropBuildRise: 0.3
    dropNoveltyRatio: 5
    dropNoveltyWindowMs: 12000
    dropRelLevel: 0
    dropNisThreshold: 6.63
    dropKalmanQ: 0.001
    dropCoWindowMs: 60
    slowZoneRef: 0.07
    slowZoneWidth: 0.04
    slowFluxFloor: 0.1
    stemsTimeoutMs: 300
    eventRefractoryMs: 3500
    falseFireCount: 3
    falseFireWindowMs: 30000
    falseFireQuietMs: 60000
  derivedSignals:
    # Dominant-note colour smoothing. All hop counts below are at the shipped
    # 86.13 analysis hops/s (11.61 ms per hop).
    #
    # LATENCY — MEASURED, not estimated. A change first needs
    # ceil(medianN * minConsensus) = 9 hops for the new class to become the
    # evidence-window mode, then holdHops (or nearHoldHops) more hops of
    # agreement; the first of those is the same hop, hence the -1:
    #   * FAR move (more than nearChangeSemitones = 2 semitones):
    #     9 + 10 - 1 = 18 hops = 0.21 s ideal.
    #   * NEAR move (<= 2 semitones): 9 + 24 - 1 = 32 hops = 0.37 s ideal.
    #     nearHoldHops deliberately makes a small move expensive because a
    #     1-2 semitone step is indistinguishable from a dominant-frequency
    #     tracker glide. Most bass/root progression moves ARE near moves, so
    #     0.37 s is the typical case, not 0.21 s.
    #   * NEAR move through the REAL analyzer at 18 dB SNR: the fixed holdout
    #     shows 451 ms typical change latency, 853.6 ms p90 run-level p95
    #     latency and 934.8 ms worst run-level p95 latency. The dom tracker
    #     adds its own lag. (tests/audio/note_estimator_noisy.test.mjs)
    #   * First note after boot or a long silence: 18 hops = 0.21 s.
    #
    # DESIGN CONSEQUENCE: this tracks ONE DOMINANT/ROOT PITCH in sustained
    # notes and chords; it does not identify chord quality. A root held for
    # less than about 0.5 s never commits, so arps, fills and fast melodic
    # lines HOLD the colour on the last committed pitch instead of chasing
    # them. That is intentional: audioNote/audioNoteHue are a stable harmonic
    # bed, not a transcription or chord detector.
    #
    # SCOPE — WHERE THIS IS VALIDATED. Do not claim more than this.
    # PARITY-LOCKED: every figure in this block also appears verbatim in
    # docs/AUDIO_SIGNALS.md, and tests/audio/note_evidence_docs_parity.test.mjs
    # fails naming BOTH files if they ever disagree. Re-measure with
    # tests/audio/note_estimator_noisy.test.mjs, then update both together.
    #   * VALIDATED at the `moderate` mic tier ONLY (18 dB SNR), on a synthetic
    #     124 BPM house root progression, fixed 24-seed prime holdout.
    #     Measured: 93.43% mean settled-window accuracy, 51.09% mean
    #     full-segment accuracy over each FULL 968 ms root segment (commit
    #     latency consumes roughly the first half), 99.17% mean expected
    #     root-change recall, and 18 of 24 clean committed sequences.
    #   * MEASURED AGAINST THIS FILE ONLY. The holdout scores the tracked
    #     config.yaml audio block and deliberately does NOT overlay
    #     states/<scene>/audio_state.yaml, whose live `bands.inputGain` moves
    #     the whole result (93.43% settled at gain 1, 98.27% at the operator's
    #     live gain 9.1, measured 2026-08-14). A gate a gain knob can lift is
    #     not a gate.
    #   * DEGRADED TO NON-FUNCTIONAL at the `heavy` tier (9 dB SNR) — REPORT
    #     ONLY, never gated, never promoted into a threshold. Measured over
    #     fixed seeds 1-4: 11.22% heavy-tier settled accuracy, 9.81% heavy-tier
    #     full-segment score and 13.33% heavy-tier root-change recall. Note
    #     colour must NOT be relied on for a far / loud / dusty capture.
    #   * UNVALIDATED at the `playa` and `adversarial` tiers (wind gusts,
    #     neighbour-camp bleed, hard clipping): never scored for note tracking.
    # Making the heavy tier work is a redesign (chroma-based pitch estimation),
    # not a retune of these knobs — deliberately out of scope.
    noteTracking:
      minPitchHz: 40
      maxPitchHz: 1200
      preferLow: true
      preferLowEnergyFrac: 0.5
      energyGate: 0.05
      medianN: 15
      minConsensus: 0.55
      holdHops: 10
      nearChangeSemitones: 2
      nearHoldHops: 24
      kfQ: 0.15
      kfR: 8
      stableHops: 18
    # Circle-of-fifths note → hue map. Hue only: Companion previews use full
    # saturation/value, while patterns retain their own saturation/brightness.
    noteColors:
      c: 0.15
      cSharp: 0.94
      d: 0.44
      dSharp: 0.04
      e: 0.62
      f: 0.12
      fSharp: 0.86
      g: 0.27
      gSharp: 0.99
      a: 0.56
      aSharp: 0.08
      b: 0.70
    party:
      wLow: 0.4
      wMid: 0.4
      wHigh: 0.2
      loudTau: 0.4
      onThresh: 0.22
      offThresh: 0.12
      holdMs: 1200
      offConfirmMs: 800
      warmupMs: 1500
    trackChange:
      wLow: 0.4
      wMid: 0.4
      wHigh: 0.2
      loudTau: 0.35
      onThresh: 0.2
      offThresh: 0.1
      silenceConfirmMs: 450
      gapMinMs: 600
      changeRefractoryMs: 4000
      tempoUnlockMs: 1500
      tempoJumpBpm: 6
      warmupMs: 1500
    switch:
      startupGuardMs: 2000
      patternMinDwellMs: 6000
      dropMinDwellMs: 2500
      energyRegimeHi: 0.6
      energyRegimeLo: 0.3
      regimeHoldMs: 1500
      dropPulseFire: 0.5
      slowZoneHi: 0.55
      slowZoneLo: 0.35
      quantizeToBeat: true
      quantizeMaxWaitMs: 350
      patternUrgeTau: 8
      colorMinDwellMs: 2500
      noteChangeMinDwellMs: 1800
      colorUrgeTau: 4
    bandOnsets:
      threshold: 1.8
      absFloor: 0.03
      refractoryMs: 90
      decayMs: 70
      emaAlphaUp: 0.01
      emaAlphaDown: 0.08
      warmupHops: 30
    chestHit:
      droneTau: 0.5
      tHigh: 0.18
      tLow: 0.08
      absFloor: 0.05
      refractoryMs: 110
      decayMs: 90
      warmupHops: 30
    phrase:
      phraseBars: 8
      downbeatFire: 0.5
      dropFire: 0.5
      dropReanchorMs: 1500
    dropCountdown:
      peakScore: 0.7
      peakHoldMs: 600
      dropPeakExit: 0.55
      climbFromScore: 0.3
      climbWindowMs: 4000
      minConfArm: 0.7
      peakMaxMs: 4000
      beatFire: 0.6
      beatRearm: 0.3
      refractoryMs: 180
      dropFire: 0.5
      dropRefractoryMs: 4000
      pulseDecayMs: 80
