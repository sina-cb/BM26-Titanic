# Auto-written by MarsinEngine — per-scene audio state.
# Contains:
#   - mic selection  (capture.platform/inputFormat/device/deviceLabel/deviceId/selectedAt)
#   - listener tuning (enabled, fftSize, hopSize, bands{...}, kick{...})
# Written by `engine.js --choose_mic --model <scene>` (mic) and by
# PATCH /audio/config from CaptainPad (tuning). Do not hand-edit while
# the engine is running.
capture:
  device: ':2'
  deviceLabel: Amazon USB Streaming Mic
  deviceId: avfoundation-audio-2
  inputFormat: avfoundation
  platform: darwin
enabled: true
chains:
  micLow:
    - id: low_gain
      type: gain
      enabled: true
      params:
        paramKey: micLowGain
    - id: low_compressor
      type: compressor
      enabled: true
      params:
        threshold: 0.55
        ratio: 3
        attackMs: 10
        releaseMs: 140
    - id: low_envelope
      type: envelope
      enabled: true
      params:
        attackMs: 12
        releaseMs: 220
  micMid:
    - id: mid_gain
      type: gain
      enabled: true
      params:
        paramKey: micMidGain
    - id: mid_envelope
      type: envelope
      enabled: true
      params:
        attackMs: 20
        releaseMs: 300
    - id: mid_curve
      type: curve
      enabled: true
      params:
        shape: easeOut
    - id: mid_lpf
      type: lpf
      enabled: true
      params:
        cutoffHz: 8
  micHigh:
    - id: high_gain
      type: gain
      enabled: true
      params:
        paramKey: micHighGain
    - id: high_slew
      type: slew
      enabled: true
      params:
        maxStepPerSec: 6
    - id: high_compressor
      type: compressor
      enabled: true
      params:
        threshold: 0.35
        ratio: 4
        attackMs: 4
        releaseMs: 90
    - id: high_lpf
      type: lpf
      enabled: true
      params:
        cutoffHz: 10
  micKick:
    - id: kick_gain
      type: gain
      enabled: true
      params:
        paramKey: micKickGain
    - id: kick_envelope
      type: envelope
      enabled: true
      params:
        attackMs: 8
        releaseMs: 180
    - id: kick_schmitt
      type: schmitt
      enabled: true
      params:
        tHigh: 0.5
        tLow: 0.3
        refractoryMs: 200
    - id: kick_hold
      type: hold
      enabled: true
      params:
        timeoutMs: 120
        decayMs: 120
  stemsBass:
    - id: stems_bass_gain
      type: gain
      enabled: true
      params:
        paramKey: stemsBassGain
  stemsDrums:
    - id: stems_drums_gain
      type: gain
      enabled: true
      params:
        paramKey: stemsDrumsGain
  stemsVocals:
    - id: stems_vocals_gain
      type: gain
      enabled: true
      params:
        paramKey: stemsVocalsGain
fftSize: 1024
hopSize: 512
bands:
  lowMaxHz: 200
  midMaxHz: 4000
  attackMs: 8
  releaseMs: 180
  noiseGate: 0.04
kick:
  minHz: 50
  maxHz: 110
  threshold: 1.8
  refractoryMs: 140
  decayMs: 120
