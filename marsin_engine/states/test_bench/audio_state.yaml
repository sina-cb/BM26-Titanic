# Auto-written by MarsinEngine — per-scene audio state.
# Contains:
#   - mic selection  (capture.platform/inputFormat/device/deviceLabel/deviceId/selectedAt)
#   - listener tuning (enabled, fftSize, hopSize, bands{...}, kick{...})
# Written by `engine.js --choose_mic --model <scene>` (mic) and by
# PATCH /audio/config from CaptainPad (tuning). Do not hand-edit while
# the engine is running.
capture:
  device: ':1'
  deviceLabel: MacBook Pro Microphone
  deviceId: avfoundation-audio-1
  inputFormat: avfoundation
  platform: darwin
enabled: true
chains:
  micLow:
    - id: low_gain
      type: gain
      enabled: true
      params:
        paramKey: micLowGain
  micMid:
    - id: mid_gain
      type: gain
      enabled: true
      params:
        paramKey: micMidGain
  micHigh:
    - id: high_gain
      type: gain
      enabled: true
      params:
        paramKey: micHighGain
  micKick:
    - id: kick_gain
      type: gain
      enabled: true
      params:
        paramKey: micKickGain
    - id: kick_envelope
      type: envelope
      enabled: true
      params:
        attackMs: 8
        releaseMs: 180
    - id: kick_schmitt
      type: schmitt
      enabled: true
      params:
        tHigh: 0.5
        tLow: 0.3
        refractoryMs: 200
    - id: kick_hold
      type: hold
      enabled: true
      params:
        timeoutMs: 120
        decayMs: 120
  stemsBass:
    - id: stems_bass_gain
      type: gain
      enabled: true
      params:
        paramKey: stemsBassGain
  stemsDrums:
    - id: stems_drums_gain
      type: gain
      enabled: true
      params:
        paramKey: stemsDrumsGain
  stemsVocals:
    - id: stems_vocals_gain
      type: gain
      enabled: true
      params:
        paramKey: stemsVocalsGain
