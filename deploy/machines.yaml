# machines.yaml - one entry per BM26 Titanic show server (docs/43).
#
# Checked in. LAN hostnames/IPs only - NEVER credentials, and no MACs (the
# security check bans them). Each machine is keyed by its Windows hostname
# (matched case-insensitively by deploy\boot_server.ps1 at boot).
#
# Strict two-level structure only - 'machines:' -> '<name>:' -> '<key>: value'
# at 0 / 2 / 4-space indent. The supervisor's parser FAILs loudly on anything
# else, so keep the shape below.
#
# Edit a machine's boot scene with deploy\set_boot.ps1 -Scene <scene> (it
# rewrites just that machine's block), or by hand here.
machines:
  titanic-int:
    host: 10.1.1.152
    role: interior lights
    scene: test_bench
    pattern: 00_golden_hour_wash
    profile: prod
    open_browser: true
    dest: C:\titanic\BM26-Titanic
    share: \\10.1.1.152\titanic
    ssh_user: titanic
    notes: first server - interior/rooms universes
