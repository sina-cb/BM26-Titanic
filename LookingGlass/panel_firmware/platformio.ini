; =============================================================
;  LookingGlass — Control-panel firmware
;  Target: ESP32-S3R8  (16MB flash, 8MB octal PSRAM, USB-Serial/JTAG)
;          — same silicon as the BM26 Stoker controller.
; =============================================================
;  Build:    pio run
;  Flash:    pio run -t upload      (hold BOOT on the board first if the
;                                    auto-reset into download mode fails)
;  Monitor:  pio device monitor     (115200 baud)
;
;  Serial note: this chip exposes the ESP32-S3 *native* USB Serial/JTAG
;  on the USB-C port (VID 303A), so `Serial` is routed over native USB
;  (CDC_ON_BOOT=1). The same USB-C port used for flashing also carries
;  the serial banner + button events.

[env:panel]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi   ; quad flash + octal PSRAM (R8)
board_upload.flash_size = 16MB

monitor_speed = 115200
upload_speed = 921600
upload_protocol = esptool
upload_flags =
    --after
    hard_reset
monitor_filters = esp32_exception_decoder

; Pre-build: bake config.yaml + the env-provided build secrets ($BM26_SECRETS)
; into include/generated/net_config.h (WiFi/AP/LAN/web settings).
extra_scripts = pre:scripts/gen_config.py

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1     ; route Serial to native USB (the COM port)
    -DBOARD_HAS_PSRAM
    -Wall

lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3
    links2004/WebSockets@^2.4.1
