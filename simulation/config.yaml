# Server configuration for the BM26 Titanic simulation

http_port: 6969 # Static file server
save_port: 6970 # Save server (http_port + 1)
sacn_port: 6971 # sACN WebSocket bridge (http_port + 2)
sacn_output_port: 6972 # sACN Outbound Bridge
sacn_udp_port: 5568 # Physical E1.31 UDP protocol port

# OPTIONAL, per-machine: pin the sACN INPUT bridge's multicast joins to one
# local IPv4 address (or adapter name). Leave it out and the OS routes the join
# — fine on a single-NIC box, a coin-flip on a machine with a VPN or a virtual
# switch up. The bridge prints its choice and the full interface inventory at
# boot; if multicast sources go missing while unicast works, set this to the
# lighting-LAN address. A value that matches nothing on the box is a hard
# startup error, never a silent switch to another NIC.
# sacn_interface: <this machine's own IPv4 address on the lighting LAN>

# Not actively read by simulation, reserved here strictly to prevent port collisions
marsin_engine_port: 6968 # Engine API Server (http_port - 1); CaptainPad discovery scans exactly :6968
captainpad_web_port: 6967 # CaptainPad Web UI (http_port - 2)

# Global Effect DMX Assignments
global_effects:
  ChauvetHaze4D:
    universe: 1
    address: 510
  TEFogMachine:
    universe: 1
    address: 512
