    midiMappings: []
    notes: >-
      Prototype audition - two real dominant-frequency lanes paint broad,
      exactly mirrored longitudinal bands on both Titanic halves; LOW/KICK
      make the Organs breathe and pulse only near those same bands. Spin turns
      one shared hull-local coordinate frame so the dancers travel through the
      front/back depth without losing left/right fairness.
