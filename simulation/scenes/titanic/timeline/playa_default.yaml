              shuffle: false
            overlays: disable
            colorAutopilot:
              active: false
              palettes:
                - baby_blue
              delay_s: 60
              shuffle: false
              transitionMs: 0
            hue: 0
            globals:
              speed: 0.5
              bpmSpeedSync: 0
              # THE ANSWER'S COLOUR (docs/73 §2, PALETTE CONTRACT v2). ONE
              # `baby_reveal` playlist now serves both outcomes — the family is
              # carried by the palette, not by which playlist fires.
              # `colorPalette1` IS the answer: the patterns render that colour
              # and DERIVE their own dark tone from it (the primary's value x
              # DARK_K), so one slot decides everything and there is no two-slot
              # handshake to satisfy.
              # `colorPalette2` is still written, at the same hue and the dark
              # value, FOR OTHER CONSUMERS ONLY — the reveal patterns never read
              # it. It keeps the global palette PAIR mirroring the tone the ship
              # is actually showing.
              # `colorTransitionMs: 0` pins the palette to SNAP — the slots are
              # slewed by default, and a mid-ramp sample is an INTERMEDIATE HUE
              # crossing the wheel toward the answer, i.e. a visibly wrong
              # colour on the ship in the middle of the ceremony.
              # The curated `palette:` key was REMOVED from this step on purpose:
              # a curated palette is hue-only (s=1, v=1) and would overwrite
              # `colorPalette1` — it would change THE ANSWER'S COLOUR.
              colorTransitionMs: 0
              colorPalette1: { h: 0.594795, s: 0.967, v: 1.0 }
              colorPalette2: { h: 0.594795, s: 0.967, v: 0.28 }
