  - id: c_baby_reveal_pink
    label: BABY REVEAL - PINK
    enabled: true
    catchUp: false
    trigger:
      type: manual
    action:
      type: sequence
      steps:
        - afterSec: 0
          action:
            type: playlist
            name: baby_tease
            # PRE-EXISTING BREAK, repaired here: this pinned
            # `e_baby_tease_two_color_world_walk`, a tease retired by the
            # redesign in report `_300` and flagged as a dangling cue in `_305`
            # §2.4. Both reveal cues would have failed at fire time. Repointed
            # to the tease arc's own calm opener.
            entryId: e_baby_tease_bullseye_tide
            palette: baby_reveal_duet
            target:
              channel: deck
              id: null
            autopilot:
              active: false
              delay_s: 90
              shuffle: false
            transition:
              mode: trans_crossfade
              durationMs: 1
              enabled: false
              shuffle: false
            overlays: disable
            colorAutopilot:
              active: false
              palettes:
                - baby_reveal_duet
              delay_s: 60
              shuffle: false
              transitionMs: 0
            hue: 0
            globals:
              speed: 0.5
              bpmSpeedSync: 0
        - afterSec: 992
          action:
            type: playlist
            name: baby_reveal
            entryId: e_baby_reveal_diamond_quilt
            target:
              channel: deck
              id: null
            autopilot:
              active: true
              delay_s: 90
              shuffle: true
            transition:
              mode: trans_crossfade
              durationMs: 3000
              enabled: true
              shuffle: false
            overlays: disable
            colorAutopilot:
              active: false
              palettes:
                - baby_pink
              delay_s: 60
              shuffle: false
              transitionMs: 0
            hue: 0
            globals:
              speed: 0.5
              bpmSpeedSync: 0
              # THE ANSWER'S COLOUR (docs/73 §2, PALETTE CONTRACT v2). ONE
              # `baby_reveal` playlist now serves both outcomes — the family is
              # carried by the palette, not by which playlist fires.
              # `colorPalette1` IS the answer: the patterns render that colour
              # and DERIVE their own dark tone from it (the primary's value x
              # DARK_K), so one slot decides everything and there is no two-slot
              # handshake to satisfy.
              # `colorPalette2` is still written, at the same hue and the dark
              # value, FOR OTHER CONSUMERS ONLY — the reveal patterns never read
              # it. It keeps the global palette PAIR mirroring the tone the ship
              # is actually showing.
              # `colorTransitionMs: 0` pins the palette to SNAP — the slots are
              # slewed by default, and a mid-ramp sample is an INTERMEDIATE HUE
              # crossing the wheel toward the answer, i.e. a visibly wrong
              # colour on the ship in the middle of the ceremony.
              # The curated `palette:` key was REMOVED from this step on purpose:
              # a curated palette is hue-only (s=1, v=1) and would overwrite
              # `colorPalette1` — it would change THE ANSWER'S COLOUR.
              colorTransitionMs: 0
              colorPalette1: { h: 0.943869, s: 0.965, v: 1.0 }
              colorPalette2: { h: 0.943869, s: 0.965, v: 0.28 }
    kind: program
    hold:
      min: 120
    days: all
