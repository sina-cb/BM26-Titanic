schemaVersion: 2
name: playa_default
location:
  lat: 40.7864
  lon: -119.2065
  tz: America/Los_Angeles
  elevationM: 1190
festival:
  startDate: '2026-08-30'
  # Nine calendar dates cover eight evening arcs through the final morning.
  days: 9
autopilot:
  enabled: true
  playlist: ambient
  delay_s: 90
  shuffle: true
  target:
    channel: deck
    id: null
  mood: true
phases:
  # The schema reports one active phase. Keep the eligibility window as the
  # sole phase; the named artistic chapters are the timed cues below.
  party_window:
    start:
      clock: '21:30'
    end:
      sun: sunrise
      offsetMin: -120
looks:
  ambient:
    playlist: ambient
    autopilot:
      active: true
      delay_s: 90
      shuffle: true
    palette: deep_sea
    target:
      channel: deck
      id: null
  philharmonic:
    playlist: default
    autopilot:
      active: true
      delay_s: 90
      shuffle: false
    palette: sunset_coral
    target:
      channel: deck
      id: null
  burn_night:
    playlist: default
    autopilot:
      active: true
      delay_s: 30
      shuffle: true
    palette: bass_drop
    globals:
      master: 1
    target:
      channel: deck
      id: null
  temple:
    playlist: default
    autopilot:
      active: true
      delay_s: 90
      shuffle: false
    palette: aurora
    globals:
      master: 0.4
    target:
      channel: deck
      id: null
cues:
  - id: c_initial_off
    label: Initial festival morning — remain off until first ignition
    enabled: true
    catchUp: true
    trigger:
      type: clock
      at: '00:00'
    action:
      type: playlist
      name: white_only
      entryId: e_white_only_0_60_white_wash
      target: { channel: deck, id: null }
      palette: deep_sea
      autopilot: { active: false, delay_s: 120, shuffle: false }
      overlays: disable
      colorAutopilot: { active: false, palettes: [deep_sea], delay_s: 600, shuffle: false, transitionMs: 0 }
      globals:
        master: 0
    kind: program
    hold:
      until: { sun: sunset, offsetMin: -30 }
    days: [0]
  - id: c_ignition_white
    label: Ignition — pure white visibility
    enabled: true
    catchUp: true
    trigger:
      type: sun
      event: sunset
      offsetMin: -30
    action:
      type: playlist
      name: white_only
      entryId: e_white_only_0_60_white_wash
      target: { channel: deck, id: null }
      palette: electric_ice
      autopilot: { active: true, delay_s: 120, shuffle: false }
      transition: { mode: trans_crossfade, durationMs: 3000, enabled: true, shuffle: false }
      overlays: disable
      colorAutopilot: { active: false, palettes: [electric_ice], delay_s: 600, shuffle: false, transitionMs: 0 }
      globals:
        master: 0.8
    kind: program
    hold:
      min: 60
    days: [0, 1, 2, 3, 4, 5, 6, 7]
  - id: c_first_color
    label: First color — white with gentle sprinkles
    enabled: true
    catchUp: true
    trigger:
      type: sun
      event: sunset
      offsetMin: 30
    action:
      type: playlist
      name: dusk_sprinkles
      target: { channel: deck, id: null }
      palette: lavender_dream
      autopilot: { active: true, delay_s: 300, shuffle: false }
      transition: { mode: trans_crossfade, durationMs: 5000, enabled: true, shuffle: false }
      overlays: disable
      colorAutopilot: { active: false, palettes: [lavender_dream], delay_s: 600, shuffle: false, transitionMs: 0 }
    # Program ownership removes the ignition-expiry baseline reload. Party is
    # ineligible throughout this directed ramp; operator takeover still wins.
    kind: program
    hold:
      until: { clock: '21:30' }
    days: [0, 1, 2, 3, 4, 5, 6, 7]
  - id: c_early_night
    label: Early night — cool animated welcome
    enabled: true
