      palette: deep_sea
      autopilot: { active: true, delay_s: 90, shuffle: true }
      transition: { mode: trans_crossfade, durationMs: 5000, enabled: true, shuffle: false }
      overlays: disable
      colorAutopilot:
        active: true
        palettes: [deep_sea, lavender_dream, aurora]
        delay_s: 300
        shuffle: false
        transitionMs: 10000
    kind: ambient
    days: [0, 1, 2, 3, 4, 5, 6, 7]
  - id: b1_midnight_drive
