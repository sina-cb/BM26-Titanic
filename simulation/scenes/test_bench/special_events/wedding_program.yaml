# Wedding — SPECIAL EVENT show #2 (docs/52)
#
# The operator's order, verbatim: "also add a wedding program too".
#
# Designed by analogy with `baby_reveal.yaml` — read that file first; every
# mechanism here is one it already proved live. Six stages, one thumb, in the
# order a wedding actually happens:
#
#   GATHERING → PROCESSION → CEREMONY → THE KISS → CELEBRATION → PHOTO GLOW
#
# WHAT IS DATA HERE. Everything: the stage order, the button words, the accent
# colours, the quick-effect palette, and every timing number below. Retuning
# the wedding is a YAML edit, never a code change.
#
# WHAT THIS FILE DOES NOT OWN. Playlist CONTENT. `wedding_gathering`,
# `wedding_procession`, `wedding_ceremony`, `wedding_party` and `wedding_glow`
# are playlists in simulation/scenes/<scene>/playlists/. The runner refuses to
# ARM — loudly, by name — if any of them is missing or has no loadable entry,
# and it never authors playlist content itself. Tune them on the deck and
# re-save; nothing in this file assumes their contents.
#
# ARM (not a stage) captures the pre-show look as the reserved snapshot
# `ev_prev`, disarms the deck's pattern + colour autopilots, and takes the
# timeline's operator lease. FINISH / ABORT morph `ev_prev` back over 3 s,
# re-arm the autopilots and hand the plan back. PANIC always wins and skips the
# snapshot recall. Nothing changes on the rig until you fire GATHERING.
#
# VERBS USED, AND ONE DELIBERATELY NOT USED. This show speaks only `playlist`,
# `masterFade` and `effect` — the three verbs the pre-show snapshot actually
# covers (`captureLook()` records master + deck + overlays + groups). The
# `globals` verb exists in the schema but the special-event snapshot does NOT
# capture the shared ParamCenter bucket, so a `globals` write would survive
# FINISH and quietly leave the night retuned. Pinning SPEED for the ceremony
# would be lovely; it is not safe until the runner's snapshot covers globals.
#
# ROTATION. Every stage that HOLDS authors an `autopilot:` block, so its
# playlist walks itself while the operator watches the room instead of the
# glass. All five rotating stages use `shuffle: false`: each playlist is
# ordered as an arc, and shuffling would throw that away. THE KISS authors the
# block with `active: false` for a different reason entirely — see its comment;
# it is the only stage in the show that must swap as a hard CUT.
#
# COLOUR, HONESTLY. The rig's warm/gold character comes from two places. The
# WHITE ONLY family (60/61/62/63/64) exports no `colorPalette1/2`, so the live
# global palette CANNOT tint it — that is why CEREMONY and PHOTO GLOW look
# right whatever the deck was doing before ARM. Every other pattern here DOES
# take the global palette, so the colour of GATHERING / PROCESSION /
# CELEBRATION is whatever palette is live when you arm. For a gold wedding,
# set the palette warm before ARM (`Phoenix` is the closest shipped pair);
# there is no palette verb in the show schema to do it for you.

schemaVersion: 1
id: wedding_program
name: Wedding
color: '#F3E2C7'
# No `icon:` — same reason as baby_reveal: CaptainPad's IconSymbol map has no
# rings/heart glyph, and an unmapped SF name renders a blank 0x0 (report _206
# §4). The card identifies the show by its champagne accent bar and its name.
description: Six stages from the first guest to the last photograph, with one white flash in the middle.

stages:
  # ── 1. GATHERING ─────────────────────────────────────────────────────────
  # Guests arriving. Warm, welcoming, and indefinite — the operator holds here
  # as long as the crowd needs. The quick effects are momentary PULSES: they
  # fire and release themselves and never advance the stage, so they can be
  # drummed on at will. STROBE and UV are deliberately absent: nobody strobes
  # an arrival.
  - id: gathering
    label: GATHERING
    color: '#FFD9A0'
    hint: Guests arriving. Warm and welcoming — hold as long as you like.
    advance: manual
    actions:
      - { type: playlist, playlist: wedding_gathering }
    # Every stage below that holds for a while ROTATES through its playlist.
    # `shuffle: false` everywhere on purpose: each wedding playlist is ordered
    # as an arc (see its file header), and shuffling would throw the arc away.
    # Flip it to true per stage if you'd rather have surprise than shape.
    autopilot:
      active: true
      everySec: 75
      shuffle: false
      transition:
        enabled: true
        mode: trans_crossfade
        durationMs: 3000
    extend:
      label: RESTART GATHERING
      actions:
        - { type: playlist, playlist: wedding_gathering }
    # Soft exit (docs/57 §2): the boost ramps out over `releaseMs` while the
    # gathering look rises back through it. FLASH ALL WHITE is not a chip on any
    # stage — the all-white slam belongs to THE KISS, and the schema refuses it
    # inside quickEffects.
    quickEffects:
      - id: vintage_white
        label: VINTAGE WHITE
        color: '#FFD9A0'
        actions:
          - { type: effect, effectId: vintageWhite, holdMs: 600, releaseMs: 800 }

  # ── 2. PROCESSION ────────────────────────────────────────────────────────
  # The walk. The playlist is ordered as a build — one white breath, then
  # geometry that grows through the whole ship — so the stage needs no timing
  # of its own. One quick effect only: a warm punctuation for the moment they
  # reach the front.
  - id: procession
    label: PROCESSION
    color: '#E9DFC9'
    hint: The walk. Slow, monumental, building — fire CEREMONY when they arrive.
    advance: manual
    actions:
      - { type: playlist, playlist: wedding_procession }
    # Eight looks at 40 s ≈ a five-minute walk, in the authored order, with a
    # long crossfade so no cut ever punctuates the aisle.
    autopilot:
      active: true
      everySec: 40
      shuffle: false
      transition:
        enabled: true
        mode: trans_crossfade
        durationMs: 4000
    extend:
      label: RESTART PROCESSION
      actions:
        - { type: playlist, playlist: wedding_procession }
    quickEffects:
      - id: vintage_white
        label: VINTAGE WHITE
        color: '#FFD9A0'
        actions:
          - { type: effect, effectId: vintageWhite, holdMs: 600, releaseMs: 800 }

  # ── 3. CEREMONY ──────────────────────────────────────────────────────────
  # Vows. Two things happen together: the calm, mostly palette-immune ceremony
  # playlist lands, and the grand master rides DOWN to 0.55 over 6 s so the
  # surround recedes and the couple is the brightest thing left. That is the
  # same clean, transient, non-persisted ramp POST /mixer/master/fade uses —
  # THE KISS simply rides it back up. The e-stop blackout is never used here.
  #
  # NO QUICK EFFECTS, on purpose. There is no button on this screen that can
  # flash the ship during someone's vows.
  - id: ceremony
    label: CEREMONY
    color: '#FFF3E0'
    hint: Vows. The surround dims to a candle glow. Nothing flashes here.
    advance: manual
    actions:
      - { type: playlist, playlist: wedding_ceremony }
      - { type: masterFade, target: 0.55, durationMs: 6000 }
    # The slowest rotation in the show: six looks at two minutes each covers a
    # twelve-minute ceremony without anyone noticing a change happened.
    autopilot:
      active: true
      everySec: 120
      shuffle: false
      transition:
        enabled: true
        mode: trans_crossfade
        durationMs: 5000
    extend:
      label: MORE TIME
      actions:
        - { type: playlist, playlist: wedding_ceremony }

  # ── 4. THE KISS ──────────────────────────────────────────────────────────
  # The ceremonial moment, built exactly like Baby Reveal's: two huge buttons,
  # and what happens AFTER the kiss is chosen AT the button, because the room
  # tells you which one it wants about half a second before you press it.
  #
  # THE FLASH-THEN-PLAYLIST ORDERING IS THE MOMENT, authored here as absolute
  # offsets from the tap:
  #   t=0 ms    grand master snaps back up over 200 ms (the ceremony dim ends)
  #   t=0 ms    FLASH ALL WHITE — every channel slammed to 1.0 for 900 ms
  #   t=700 ms  the landing playlist is activated UNDER the flash
  #   t=900 ms  the flash starts its RELEASE — the new look is already there
  #   t=1600 ms the release is out; the landing look is alone on the ship
  # Retune by moving these numbers; nothing in the engine assumes them.
  #
  # THE RELEASE (docs/57 §2). `releaseMs: 700, releaseTo: show` makes the flash
  # bloom out instead of cutting: the white decays while the landing look RISES
  # THROUGH it. The swap stays hidden BY CONSTRUCTION — the release starts where
  # the hold ends (900 ms) and the swap landed at 700 ms, so 200 ms of full white
  # still covers it and the envelope only ever reveals what is already there.
  # Invariant the tests pin: `playlist.delayMs <= effect.delayMs + holdMs`.
  #
  # THE `autopilot:` BLOCK HERE IS NOT ABOUT ROTATION — IT IS THE CUT.
  # `active: false` means this stage never rotates (a ceremonial moment that
  # quietly swaps looks underneath itself would be a bug). What the block is
  # actually for is `transition: { enabled: false }`: the runner applies a
  # stage's transition config BEFORE that stage's actions, and this stage needs
  # a HARD CUT under the flash — measured on the bench, a ~5 s dissolve means a
  # 900 ms flash hides nothing and the audience watches the swap.
  #
  # As of docs/57 §6 (G2) the runner forces `{ enabled: false }` on any stage
  # that authors no `autopilot:` block at all, so this is no longer the only
  # thing standing between THE KISS and the ceremony's 5-second crossfade. It
  # stays anyway: explicit beats implicit in show data, and the block still
  # carries `active: false` in its own right.
  #
  # WANT ONE BUTTON INSTEAD OF TWO? The schema requires 2..4 `choices`, so a
  # single-button kiss means replacing this `choices:` block with the winning
  # variant's `actions:` list verbatim (and dropping `choices:`). Everything
  # else about the stage stays as-is; `ceremonial: true` still blacks out the
  # rest of the column around it.
  - id: kiss
    label: THE KISS
    color: '#FFFFFF'
    ceremonial: true
    hint: The moment. The flash lands first, and what comes out of it is your call.
    advance: manual
    autopilot:
      active: false
      transition:
        enabled: false
    choices:
      - id: party
        label: KISS → PARTY
        color: '#FFA94D'
        actions:
          - { type: masterFade, target: 1.0, durationMs: 200 }
          - { type: effect, effectId: blastWhite, holdMs: 900, releaseMs: 700, releaseTo: show }
          - { type: playlist, playlist: wedding_party, delayMs: 700 }
      - id: glow
        label: KISS → GLOW
        color: '#F3E2C7'
        actions:
          - { type: masterFade, target: 1.0, durationMs: 200 }
          - { type: effect, effectId: blastWhite, holdMs: 900, releaseMs: 700, releaseTo: show }
          - { type: playlist, playlist: wedding_glow, delayMs: 700 }

  # ── 5. CELEBRATION ───────────────────────────────────────────────────────
  # First dance and the party. This is a REAL stage, not a hold: it starts
  # `wedding_party` whichever way THE KISS landed — immediately, if the kiss
  # went to GLOW; as a restart from the top, if it already went to PARTY. This
  # is also where the full quick-effect palette lives, including the two the
  # earlier stages deliberately withheld.
  - id: celebration
    label: CELEBRATION
    color: '#FFA94D'
    hint: First dance and the floor. Drum the quick effects.
    advance: manual
    actions:
      - { type: playlist, playlist: wedding_party }
    # A party wants punctuation, not mush: `trans_flash` puts a short white
    # snap between looks (nowhere near strobe territory at once per 45 s). Swap
    # `mode` for `trans_crossfade` if the floor wants a smoother night, or set
    # `enabled: false` for hard cuts.
    autopilot:
      active: true
      everySec: 45
      shuffle: false
      transition:
        enabled: true
        mode: trans_flash
        durationMs: 400
    extend:
      label: RESTART THE PARTY
      actions:
        - { type: playlist, playlist: wedding_party }
    quickEffects:
      - id: strobe
        label: STROBE
        color: '#FFF6E8'
        actions:
          - { type: effect, effectId: strobe, hz: 6, durationMs: 1200, fadeOutMs: 400 }
      - id: vintage_white
        label: VINTAGE WHITE
        color: '#FFD9A0'
        actions:
          - { type: effect, effectId: vintageWhite, holdMs: 600, releaseMs: 800 }
      - id: uv_blast
        label: UV BLAST
        color: '#9E6BFF'
        actions:
          - { type: effect, effectId: uvBlast, holdMs: 800, releaseMs: 800 }

  # ── 6. PHOTO GLOW ────────────────────────────────────────────────────────
  # The party comes down and the rig turns into a light for faces: warm, low
  # motion, mostly white-family. The master ramp to full is belt-and-braces —
  # a no-op when THE KISS already put it there, and insurance if anything else
  # left the house down. This stage carries the FINISH affordance; END SHOW
  # puts the night back exactly the way it was before ARM.
  - id: photos
    label: PHOTO GLOW
    color: '#F3E2C7'
    hint: Hold here for photos. END SHOW puts the night back the way it was.
    advance: manual
    actions:
      - { type: playlist, playlist: wedding_glow }
      - { type: masterFade, target: 1.0, durationMs: 2000 }
    autopilot:
      active: true
      everySec: 90
      shuffle: false
      transition:
        enabled: true
        mode: trans_crossfade
        durationMs: 4000
    extend:
      label: RESTART GLOW
      actions:
        - { type: playlist, playlist: wedding_glow }
    quickEffects:
      - id: vintage_white
        label: VINTAGE WHITE
        color: '#FFD9A0'
        actions:
          - { type: effect, effectId: vintageWhite, holdMs: 600, releaseMs: 800 }
