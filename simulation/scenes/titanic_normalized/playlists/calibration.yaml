schemaVersion: 1
name: calibration
entries:
  - id: e_calibration_0_66_calibration_x_plane
    pattern: 66_calibration_x_plane
    label: 01 — X Plane (left/right)
    defaults:
      sliderPosition: 1
      sliderWidth: 0.34
      sliderBackground: 0
    modulations: []
    midiMappings: []
    notes: >-
      Move Position from 0 to 1. Red should travel through the model from one X
      side to the other; cyan keeps every mapped pixel faintly visible.
  - id: e_calibration_1_67_calibration_y_plane
    pattern: 67_calibration_y_plane
    label: 02 — Y Plane (low/high)
    defaults:
      sliderPosition: 0.09
      sliderWidth: 0.47
      sliderBackground: 0.38
    modulations: []
    midiMappings: []
    notes: >-
      Move Position from 0 to 1. Green should travel through the model from low
      Y to high Y; magenta keeps every mapped pixel faintly visible.
  - id: e_calibration_2_68_calibration_z_plane
    pattern: 68_calibration_z_plane
    label: 03 — Z Plane (depth)
    defaults:
      sliderPosition: 0.75
      sliderWidth: 0.28
      sliderBackground: 0.1
    modulations: []
    midiMappings: []
    notes: >-
      Move Position from 0 to 1. Blue should travel through model depth; warm
      gold keeps every mapped pixel faintly visible.
  - id: e_calibration_3_69_calibration_coordinate_rgb
    pattern: 69_calibration_coordinate_rgb
    label: 04 — XYZ Coordinate RGB
    defaults:
      sliderLevel: 0.99
      sliderFloor: 0.05
    modulations: []
    midiMappings: []
    notes: >-
      Static coordinate truth map: red = X, green = Y, blue = Z. Nearby pixels
      should have nearby colors; sudden color breaks expose misplaced geometry.
  - id: e_calibration_4_70_calibration_fixture_types
    pattern: 70_calibration_fixture_types
    label: 05 — Fixture Types
    defaults:
      sliderLevel: 0.33
    modulations: []
    midiMappings: []
    notes: >-
      Strands cyan, pars green, Vintage gold, bars red, haze blue, fog violet,
      TE signs magenta; white means unknown fixture metadata.
  - id: e_calibration_5_71_calibration_fixture_pixel_order
    pattern: 71_calibration_fixture_pixel_order
    label: 06 — Fixture Pixel Order
    defaults:
      sliderPosition: 0
      sliderBackground: 0.07
    modulations: []
    midiMappings: []
    notes: >-
      Selected local pixel is white, previous is red, next is green. Sweep
      Position to find reversed, broken, or misordered fixture pixels.
  - id: e_calibration_6_72_calibration_controller_focus
    pattern: 72_calibration_controller_focus
    label: 07 — Controller Focus
    defaults:
      sliderController: 0.54
      sliderBackground: 0.21
    modulations: []
    midiMappings: []
    notes: >-
      Sweep Controller through CTRL_1 to CTRL_18. The selected controller is
      white; missing controller metadata is magenta.
  - id: e_calibration_7_73_calibration_emitter_channels
    pattern: 73_calibration_emitter_channels
    label: 08 — Emitter Channels
    defaults:
      sliderChannel: 0
      sliderLevel: 0.8
    modulations: []
    midiMappings: []
    notes: >-
      Channel selects red, green, blue, matched W+A white, UV, then RGB white.
      Use this to verify emitter capability and channel order.
  - id: e_calibration_8_74_calibration_bpm_ruler
    pattern: 74_calibration_bpm_ruler
    label: 09 — Global SPEED / BPM Ruler
    defaults:
      sliderPhaseOffset: 0.11
      sliderWidth: 0.28
      sliderLevel: 0.8
      sliderBackground: 0.18
    modulations: []
    midiMappings: []
    notes: >-
      Turn global Sync off. The cyan runner crosses one four-beat bar and the
      warm-white flash marks beat one. At SPEED 0.50 it matches 120 BPM. Align
      Phase Offset once, then adjust only global SPEED. Expected fader points:
      60 BPM 0.250, 90 BPM 0.396, 120 BPM 0.500, 150 BPM 0.580, 180 BPM 0.646.
  - id: e_calibration_9_75_calibration_group_walk
    pattern: 75_calibration_group_walk
    label: 10 — Group Walk (order + colour)
    defaults:
      sliderBackground: 0.3
      sliderTeSign: 0
      sliderTeSign2: 0
      sliderRightFrontWall: 0
      sliderRightSmokeStacks: 0
      sliderRightFrontRails: 0
      sliderRightAuditorium: 0
      sliderLeftAuditorium: 0
      sliderLeftBackWall: 0
      sliderRightBackWall: 0
      sliderLeftFrontWall: 0
      sliderLeftSmokeStack: 0
      sliderLeftFrontRails: 0
      sliderRightBackRails: 0
      sliderLeftBackRails: 0
      sliderLeftSmallStack: 0
      sliderRightSmallStack: 0
      sliderStringsFrontLeft: 0
      sliderStringsBackLeft: 0
      sliderStringsBackRight: 0
      sliderStringsFrontRight: 0
      sliderStringsRBackLeft: 0
      sliderStringsRBackRight: 0
      sliderStringsRFrontRight: 0
      sliderStringsRFrontLeft: 0
    modulations: []
    midiMappings: []
    notes: >-
      One fader per pixel group. Raise a group fader from 0 to 1: its LEDs light
      one by one in true wiring order, coloured red, green, blue, white
      repeating by position. Out-of-sequence pixel = mis-mapped strand; wrong
      colour = swapped channel. Titanic-family only (baked group ranges).
