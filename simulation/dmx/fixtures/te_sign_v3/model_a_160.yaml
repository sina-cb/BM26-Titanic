# The pucks are RGBW — the SAME LEDs as the rope strands (operator, 2026-07-31).
# NOTE: for an LED-bus fixture this block documents the PHYSICAL puck format only.
# The authority at run time is the `led.order` / `stride` of the owning
# MarsinLED output — exactly as for a rope strand. The exporter reads the
# channel map off the controller, never from here.
#
# GENERATED by tools/gen_te_sign_fixture.js from the CAD LED-string export.
# Do not hand-edit: re-run the generator against the newest CSVs instead.
# Shared 0-1 normalisation (ONE factor over side A + side B together, never per side):
#   u = (x_mm - 166.7) / 2165.1   v = (y_mm - 144.3) / 2165.1
