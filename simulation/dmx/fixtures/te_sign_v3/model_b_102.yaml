# TE Sign V3 — Side B (seam half B) — LED Fixture Pixel Model (102ch)
# 34 puck LEDs on back-panel half B of the CNC-built "Titanic's End" logo sign.
# Data/chain order = physical strand order: panels P5 -> P6 -> P7 -> P8, start->end within each panel.
# Frame: mm, origin at the FULL SIGN bbox center (1972.6 x 2509.5 mm), X right, Y up,
# +Z = emission side. Side A and Side B share this frame: place both fixtures at the
# SAME scene transform and the two halves assemble into the one physical sign.
# Bus: LED — Ango 4 (chroma.tech) sACN pixel controller, 110 VAC -> 24 VDC.
# Pure pixel fixture: no master channels. Pixel i uses R=3i+1, G=3i+2, B=3i+3.

model:
  id: "te_sign_v3_b_102"
  name: "TE Sign V3 Side B"
  fixture_type: "TeSignV3B34"
  channel_mode: 102
  bus: led
  controller_family: ango_4
