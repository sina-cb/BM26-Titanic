      function: Aux Red (global)
      range: 0-255
    - channel: 10
      function: Aux Green (global)
      range: 0-255
    - channel: 11
      function: Aux Blue (global)
      range: 0-255
    - channel: 12
      function: Main Light Effect
      range: 0-255, see Appendix 1
    - channel: 13
      function: Main Effect Speed
      range: 0-127=fwd, 128-255=rev
    - channel: 14
      function: Aux Light Effect
